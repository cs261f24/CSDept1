<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSDept1 - Events</title>
    <!-- Link to CSS using Flask's url_for function -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    
    
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css' rel='stylesheet' />
    
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <ul>
            <li class="logo">Welcome to the Website!</li>
            <nav class="navbar">
                <ul>
                    <li><a href="{{ url_for('reports') }}">View Reports</a></li>
                    <li><a href="{{ url_for('events') }}">View Events</a></li>
                </ul>
            </nav>
        </ul>
    </nav>

    <div class="container">
        <!-- Form for adding new events -->
        <div class="event-list">
            <form method="POST" action="/events">
                <input type="text" name="event_name" placeholder="New Event" required>
                <button type="submit">Add Event</button>
            </form>

            <ul>
                <!-- Displaying the events list -->
                {% for event in events %}
                    <li>
                        {{ event['event_name'] }} - {% if event['attended'] == 0 %} Not Attended {% else %} Attended {% endif %}
                        <!-- Form to remove an event -->
                        <form method="POST" action="/events" style="display: inline;">
                            <input type="hidden" name="remove_event_id" value="{{ event['id'] }}">
                            <button type="submit">Remove</button>
                        </form>
                    </li>
                {% endfor %}
            </ul>
            <a href="/index">Back to Home</a>
        </div>

        <!-- Calendar Section -->
        <div id="calendar"></div>
    </div>

    <!-- FullCalendar JS from CDN -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js'></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');
            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',  // Display month view by default
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                events: [],  // Start with an empty events array
            });
            calendar.render();
        });
    </script>

</body>
</html>
