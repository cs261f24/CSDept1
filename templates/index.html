<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSDept1 - Home</title>
    <!-- Link to CSS using Flask's url_for function -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}?v=2">
    <style>
        /* Additional CSS for left alignment */
        .events-section {
            margin-left: 20px; /* Add spacing from the left edge */
        }

        .events-section h2 {
            text-align: left; /* Align the heading to the left */
        }

        table {
            margin-left: 20px; /* Align the table with the heading */
            border-collapse: collapse;
            border: 1px solid #ddd;
            width: auto; /* Adjust width to content */
        }

        th, td {
            text-align: left; /* Align text in the table to the left */
            padding: 10px;
        }

        th {
            background-color: #f4f4f4;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <ul>
            <li><a href="{{ url_for('index') }}">Computer Science Department</a></li>
            <li><a href="{{ url_for('reports') }}">View Reports</a></li>
            <li><a href="{{ url_for('events') }}">View Events</a></li>
        </ul>
    </nav>

    <!-- Welcome Message -->
    <div class="welcome-message">
        <h1>Welcome, {{ user.first_name }} {{ user.last_name }}!</h1>
    </div>

    <!-- Events Section -->
    <div class="events-section">
        <h2>Events Attended</h2>
        <table>
            <thead>
                <tr>
                    <th>Event Name</th>
                </tr>
            </thead>
            <tbody>
                {% for event in attended_events %}
                    <tr>
                        <td>{{ event['event_name'] }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
