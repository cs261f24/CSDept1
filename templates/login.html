<!doctype html>
<html lang="en">
  <head>
    <title>Login</title>
  </head>
  <body>
    <img src= "https://www.xavier.edu/brand/images/new-logos/signature-vertical-logo-navy-whitebg.png" alt= "Xavier Logo" width= "500" height= "500">
    <h1>Login</h1>
    <form method="POST" action="/">
      <input type="text" name="username" placeholder="Username" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <p><a href="{{ url_for('index') }}">Go to Index</a></p>
  </body>
</html>
