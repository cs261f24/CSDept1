<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- Link to your styles.css file -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <ul>
            <li class="logo">Xavier University CS Department!</li>
        </ul>
    </nav>

    <!-- Flex Container for Login Form and Image -->
    <div class="login-wrapper">
      <!-- Login Form -->
      <div class="login-container">
        <h1>Login</h1>
        <form method="POST" action="/" class="login-form">
          <input type="text" name="username" placeholder="Username" required class="form-input">
          <input type="password" name="password" placeholder="Password" required class="form-input">
          <button type="submit" class="form-button">Login</button>
        </form>
      </div>

      <!-- Logo Image -->
      <div class="login-image">
        <img src="https://www.xavier.edu/brand/images/new-logos/signature-vertical-logo-navy-whitebg.png" alt="Xavier Logo">
      </div>
    </div>

  </body>
</html>
