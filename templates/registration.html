<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <!-- Link to your styles.css file -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <ul>
            <li class="logo">Welcome to the Website!</li>
        </ul>
    </nav>

    <!-- Flash message section -->
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash-messages">
          {% for message in messages %}
            <div class="flash-message">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <!-- Flex Container for Registration Form -->
    <div class="login-wrapper">
      <!-- Registration Form -->
      <div class="login-container">
        <h1>Register</h1>
        <form action="{{ url_for('register') }}" method="POST" class="login-form">
          <input type="email" name="email" placeholder="Email" required class="form-input">
          <input type="password" name="password" placeholder="Password" required class="form-input">
          <input type="password" name="confirm_password" placeholder="Confirm Password" required class="form-input">
          <button type="submit" class="form-button">Register</button>
        </form>
        <p>Already have an account? <a href="{{ url_for('login') }}">Log in here</a>.</p>
      </div>

      <!-- Optional Logo Image (if needed) -->
      <div class="login-image">
        <img src="https://www.xavier.edu/brand/images/new-logos/signature-vertical-logo-navy-whitebg.png" alt="Xavier Logo">
      </div>
    </div>
        <div class="form-group">
          <label>Select your role:</label><br>
          <input type="radio" name="role" value="student" required> Student<br>
          <input type="radio" name="role" value="faculty" required> Faculty<br>
      </div>

  </body>
</html>
